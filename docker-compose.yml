version: '3.8'

services:
  postgres:
    image: postgres:14
    container_name: studypal-postgres
    environment:
      POSTGRES_DB: studypal_db
      POSTGRES_USER: studypal_user
      POSTGRES_PASSWORD: studypal_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studypal_user -d studypal_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: studypal-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://studypal_user:studypal_password@postgres:5432/studypal_db
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
      - ./chroma_db:/app/chroma_db
    env_file:
      - ./backend/.env

  frontend:
    build: ./frontend
    container_name: studypal-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8000

volumes:
  postgres_data:
